name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: write
      issues: write
    env:
      MUXWAY_CORE: ${{ github.workspace }}/muxway
    steps:
      # Actions are pinned to commit SHAs; the tag is in the comment.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # The hub and agent are built from the core checkout. While that
      # repository is private, MUXWAY_CORE_TOKEN is a fine-grained token with
      # read access to its contents; once it is public the job's own token does.
      - name: Check out the core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: notmarkopadjen/muxway
          path: muxway
          token: ${{ secrets.MUXWAY_CORE_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: muxway/go.mod
          cache-dependency-path: muxway/go.sum

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install tmux
        run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)

      - name: Run end-to-end tests
        id: run
        run: |
          echo "suite=yes" >> "$GITHUB_OUTPUT"
          MUXWAY_UI=0 scripts/e2e.sh

      - name: Keep logs and traces
        if: always() && steps.run.outputs.suite == 'yes'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-run-${{ github.run_id }}
          path: test-runs/
          retention-days: 90

      - name: Check run with per-test results
        if: always() && steps.run.outputs.suite == 'yes'
        uses: dorny/test-reporter@dc3a92680fcc15842eef52e8c4606ea7ce6bd3f3 # v2.1.1
        with:
          name: e2e results
          path: test-runs/*/results.xml
          reporter: java-junit

      - name: Record the run as an issue
        if: always() && steps.run.outputs.suite == 'yes' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/record-run.sh test-runs/*/
